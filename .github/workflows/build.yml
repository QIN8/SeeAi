name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (Vercel / root)
        run: npm run build
      - name: Build (GitHub Pages base path)
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          SITE_URL: https://qin8.github.io
